name: Build All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Monorepo and Build Apps
        run: |
          unzip -o NDR_Monorepo.zip
          
          # الانتقال تلقائياً إلى المجلد المفكوك
          cd "$(find . -maxdepth 2 -type d -name "NDR_Monorepo" | head -n 1)" || cd .
          
          # منح صلاحيات التنفيذ لجميع ملفات Gradle
          find . -name "gradlew" -exec chmod +x {} \;
          
          echo "Building NDRKeyboard..."
          cd NDRKeyboard
          ./gradlew assembleDebug
          cd ..
          
          echo "Building NDRRoomAssistant..."
          cd NDRRoomAssistant
          ./gradlew assembleDebug
          cd ..
          
          echo "Building NDRRoomJoiner..."
          cd NDRRoomJoiner
          ./gradlew assembleDebug
          cd ..

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            **/NDRKeyboard/app/build/outputs/apk/debug/*.apk
            **/NDRRoomAssistant/app/build/outputs/apk/debug/*.apk
            **/NDRRoomJoiner/app/build/outputs/apk/debug/*.apk
