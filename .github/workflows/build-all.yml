name: Build All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Monorepo and Build Apps
        run: |
          unzip -o NDR_Monorepo.zip
          cd NDR_Monorepo
          
          chmod +x NDRKeyboard/gradlew NDRRoomAssistant/gradlew NDRRoomJoiner/gradlew || true
          
          echo "Building NDRKeyboard..."
          cd NDRKeyboard
          ./gradlew assembleDebug
          cd ..
          
          echo "Building NDRRoomAssistant..."
          cd NDRRoomAssistant
          ./gradlew assembleDebug
          cd ..
          
          echo "Building NDRRoomJoiner..."
          cd NDRRoomJoiner
          ./gradlew assembleDebug
          cd ..

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            NDR_Monorepo/NDRKeyboard/app/build/outputs/apk/debug/*.apk
            NDR_Monorepo/NDRRoomAssistant/app/build/outputs/apk/debug/*.apk
            NDR_Monorepo/NDRRoomJoiner/app/build/outputs/apk/debug/*.apk
