name: Build All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build Projects
        run: |
          unzip NDR_Monorepo.zip
          cd NDR_Monorepo
          # بناء المشاريع وتوليد ملفات الـ APK
          chmod +x gradlew || true
