name: Build All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Monorepo and Build Apps
        run: |
          unzip -o NDR_Monorepo.zip
          
          # الانتقال إلى المجلد المستخرج الرئيسي
          cd NDR_Monorepo
          
          # بناء NDRKeyboard
          if [ -d "NDRKeyboard" ]; then
            cd NDRKeyboard
            chmod +x gradlew || true
            ./gradlew assembleDebug || gradle assembleDebug || true
            cd ..
          fi
          
          # بناء NDRRoomAssistant
          if [ -d "NDRRoomAssistant" ]; then
            cd NDRRoomAssistant
            chmod +x gradlew || true
            ./gradlew assembleDebug || gradle assembleDebug || true
            cd ..
          fi
          
          # بناء NDRRoomJoiner
          if [ -d "NDRRoomJoiner" ]; then
            cd NDRRoomJoiner
            chmod +x gradlew || true
            ./gradlew assembleDebug || gradle assembleDebug || true
            cd ..
          fi

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            **/NDRKeyboard/app/build/outputs/apk/debug/*.apk
            **/NDRRoomAssistant/app/build/outputs/apk/debug/*.apk
            **/NDRRoomJoiner/app/build/outputs/apk/debug/*.apk
